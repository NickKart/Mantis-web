# Mantis для macOS: одна сборка для всех Mac (Apple Silicon и Intel).
# Запуск: пуш в ветку desktop-macos или вручную (Actions → «Mantis для macOS» → Run workflow).
# Результат – предварительный релиз GitHub (prerelease):
#   Mantis-Installer.pkg – мастер установки (двойной клик → «Установить» → Mantis в «Программах» и запущен);
#   Mantis.dmg – то же приложение в образе диска (окно с фоном; при запуске не из «Программ» Mantis сам предложит перенести себя).
# Prerelease не помечается «latest», поэтому прод-сервер (mantis-update.timer) его не трогает.

name: Mantis для macOS

on:
  push:
    branches: [desktop-macos]
  workflow_dispatch:

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/macos/src-tauri -> target
          key: universal

      - name: Зависимости
        run: npm ci --ignore-scripts

      - name: Сборка
        run: bash desktop/macos/build.sh universal

      - name: Проверка приложения
        run: |
          app=desktop/macos/src-tauri/target/universal-apple-darwin/release/bundle/macos/Mantis.app
          codesign --verify --deep --strict --verbose=2 "$app"
          for f in mantis mantis-agent; do
            a="$(lipo -archs "$app/Contents/MacOS/$f")"; echo "$f: $a"
            [[ "$a" == *x86_64* && "$a" == *arm64* ]]
          done
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$app/Contents/Info.plist"
          # без разрешения на камеру в подписи macOS молча запрещает камеру (hardened runtime)
          for f in mantis mantis-agent; do
            ent="$(codesign -d --entitlements - --xml "$app/Contents/MacOS/$f" 2>/dev/null)"
            echo "$f: $(codesign -dv "$app/Contents/MacOS/$f" 2>&1 | grep -o 'flags=[^ ]*')"
            echo "$ent" | grep -q "com.apple.security.device.camera" || { echo "НЕТ разрешения на камеру в подписи $f"; exit 1; }
          done

      - name: Проверка окна установки (.dmg)
        run: |
          mnt="$(hdiutil attach -nobrowse -readonly desktop/macos/out/Mantis.dmg | awk -F'\t' '/\/Volumes\//{print $NF}' | tail -1)"
          ls -la "$mnt" "$mnt/.background"
          test -L "$mnt/Applications"
          test -d "$mnt/Mantis.app"
          hdiutil detach -quiet "$mnt"

      - name: Первый запуск – «Подготовка Mac» и предложение переноса
        continue-on-error: true
        run: |
          app=desktop/macos/src-tauri/target/universal-apple-darwin/release/bundle/macos/Mantis.app
          rm -rf "$HOME/Library/Application Support/ru.rcmit.mantis"
          open -n "$app"
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8797/api/agent >/dev/null && break; sleep 1; done
          curl -fsS -o /dev/null -w "desktop-setup.html: %{http_code}\n" http://127.0.0.1:8797/desktop-setup.html
          curl -fsS http://127.0.0.1:8797/api/lan-check; echo
          sleep 6
          mkdir -p shots
          screencapture -x shots/first-run.png || true
          osascript -e 'tell application "System Events" to get name of every window of (every process whose name is "Mantis")' || true
          # перенос в «Программы»: окно вопроса в CI не нажать (нет прав на управление интерфейсом),
          # поэтому тот же перенос запускаем без вопроса – MANTIS_AUTOMOVE=1
          pkill -f "Mantis.app/Contents/MacOS/mantis" || true; sleep 2
          MANTIS_AUTOMOVE=1 "$app/Contents/MacOS/mantis" > automove.log 2>&1 &
          for i in $(seq 1 40); do pgrep -f "^/Applications/Mantis.app/Contents/MacOS/mantis" >/dev/null && break; sleep 1; done
          ls -la /Applications | grep -i mantis || true
          xattr -l /Applications/Mantis.app || true
          ps -axo command | grep -i "Mantis.app/Contents/MacOS" | grep -v grep || true
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8797/api/agent >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8797/api/agent; echo
          sleep 4
          screencapture -x shots/after-move.png || true
          # чьи окна на экране: после переноса вопроса «Перенести?» быть не должно
          ps -axo pid,command | grep -i "Mantis" | grep -v grep || true
          osascript -e 'tell application "System Events" to get {unix id, name of every window} of (every process whose name is "Mantis")' || true
          sleep 8
          screencapture -x shots/after-move-2.png || true
          # повторный запуск из «Программ» с нуля: вопроса о переносе быть не должно
          pkill -f "Mantis.app/Contents/MacOS/mantis" || true
          sleep 5
          screencapture -x shots/no-app.png || true
          open /Applications/Mantis.app
          sleep 15
          screencapture -x shots/relaunch.png || true
          pkill -f "Mantis.app/Contents/MacOS/mantis" || true
          sleep 2
          cat automove.log || true
          # если приложение упало – начало отчёта о сбое
          r="$(ls -t "$HOME"/Library/Logs/DiagnosticReports/mantis* 2>/dev/null | head -1)"
          [ -n "$r" ] && head -c 6000 "$r" || true
          test -f /Applications/Mantis.app/Contents/Info.plist && echo "ПЕРЕНОС: OK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
          if-no-files-found: ignore

      - name: Установка из .pkg (поверх перенесённой копии – как обновление)
        run: |
          pkill -f "Mantis.app/Contents/MacOS/mantis" || true
          pkgutil --payload-files desktop/macos/out/Mantis-Installer.pkg | head -5
          sudo installer -pkg desktop/macos/out/Mantis-Installer.pkg -target / -verboseR | tail -5
          test -x /Applications/Mantis.app/Contents/MacOS/mantis
          defaults read /Applications/Mantis.app/Contents/Info CFBundleShortVersionString
          codesign --verify --deep --strict /Applications/Mantis.app
          # повторная установка поверх – как обновление
          sudo installer -pkg desktop/macos/out/Mantis-Installer.pkg -target / | tail -1

      - name: Запуск встроенного Агента (Apple Silicon)
        run: |
          agent=/Applications/Mantis.app/Contents/MacOS/mantis-agent
          MANTIS_SHELL=macos MANTIS_PORT=8797 "$agent" --no-browser > agent.out 2>&1 &
          for i in $(seq 1 60); do grep -q MANTIS_READY agent.out && break; sleep 1; done
          cat agent.out
          curl -fsS http://127.0.0.1:8797/api/agent; echo
          curl -fsSI http://127.0.0.1:8797/desktop-check.html | grep -i '^cross-origin-embedder-policy: require-corp'
          kill %1 || true

      - name: Запуск встроенного Агента (Intel, через Rosetta)
        run: |
          softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then echo "Rosetta недоступна – пропускаю"; exit 0; fi
          agent=/Applications/Mantis.app/Contents/MacOS/mantis-agent
          MANTIS_SHELL=macos MANTIS_PORT=8798 arch -x86_64 "$agent" --no-browser > agent-x64.out 2>&1 &
          for i in $(seq 1 90); do grep -q MANTIS_READY agent-x64.out && break; sleep 1; done
          cat agent-x64.out
          curl -fsS http://127.0.0.1:8798/api/agent; echo
          kill %1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: Mantis-macOS
          path: |
            desktop/macos/out/Mantis-Installer.pkg
            desktop/macos/out/Mantis.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Mantis-macOS
          path: out
      - name: Предварительный релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="macos-v$VERSION-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          (cd out && sha256sum Mantis-Installer.pkg Mantis.dmg > SHA256SUMS.txt)
          gh release create "$TAG" out/Mantis-Installer.pkg out/Mantis.dmg out/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false --title "Mantis для macOS $VERSION (проверка)" \
            --notes "Для всех Mac (Apple Silicon и Intel), macOS 13 и новее. Установка: скачать Mantis-Installer.pkg, открыть, «Продолжить» → «Установить». Пока без подписи Apple: если Mac не даёт открыть установщик – «Системные настройки» → «Конфиденциальность и безопасность» → «Всё равно открыть»."
