# Деплой в прод (mantis.rcmit.ru, VDS на 1Gb): пуш в ветку prod или запуск вручную (Actions → «Деплой в прод»).
# Контур разработки – Vercel (ветка main), этот workflow его не трогает.
#
# Схема без ключей и секретов: workflow собирает релиз и публикует его как GitHub Release (latest),
# а сервер раз в минуту сам проверяет новый релиз, скачивает, сверяет sha256 и выкладывает
# (mantis-update.timer, ставит deploy/setup-server.sh). Репозиторий публичный – серверу доступ не нужен.
#
# Mantis Агент (IP-камеры) собирается на macOS-машине (там есть codesign для подписи .app) для Mac (Apple Silicon,
# Intel) и Windows и прикладывается к тому же релизу. Сервер забирает архивы в /var/www/mantis/shared/downloads –
# на них ведут кнопки «Скачать» (https://mantis.rcmit.ru/downloads/...). Если Агент не собрался, сайт всё равно выкладывается.
#
# Приложение Mantis для Mac (окно + встроенный Агент, desktop/macos) собирается там же, одной сборкой для Apple Silicon
# и Intel, и раздаётся как установщик Mantis-Installer.pkg – на него ведёт кнопка «Скачать для macOS».
# Страница внутри приложения – из того же коммита, что сайт. Не собралось – остаётся прежний установщик.
#
# Приложение Mantis для Windows (окно WebView2 + встроенный Агент, desktop/windows) собирается на windows-машине,
# проверяется установкой и запуском и раздаётся как установщик Mantis-Setup.exe – на него ведёт кнопка «Скачать для Windows».

name: Деплой в прод

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  agent:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Сборка Mantis Агента (macOS arm64, macOS x64, Windows)
        run: |
          npm ci --ignore-scripts
          BUN="$(command -v bun)" bash agent/build.sh darwin-arm64 darwin-x64 windows-x64
          cd agent/dist && shasum -a 256 Mantis-Agent-*.zip > agent.sha256 && cat agent.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: agent
          path: |
            agent/dist/Mantis-Agent-*.zip
            agent/dist/agent.sha256
          retention-days: 3

  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/macos/src-tauri -> target
          key: universal

      - name: Сборка приложения Mantis для Mac (Apple Silicon + Intel)
        run: |
          npm ci --ignore-scripts
          bash desktop/macos/build.sh universal

      - name: Проверка подписи и установщика
        run: |
          app=desktop/macos/src-tauri/target/universal-apple-darwin/release/bundle/macos/Mantis.app
          codesign --verify --deep --strict "$app"
          for f in mantis mantis-agent; do
            a="$(lipo -archs "$app/Contents/MacOS/$f")"; echo "$f: $a"
            [[ "$a" == *x86_64* && "$a" == *arm64* ]]
            # без разрешения на камеру в подписи macOS молча запрещает камеру
            codesign -d --entitlements - --xml "$app/Contents/MacOS/$f" 2>/dev/null | grep -q com.apple.security.device.camera \
              || { echo "НЕТ разрешения на камеру в подписи $f"; exit 1; }
          done
          pkg=desktop/macos/out/Mantis-Installer.pkg
          sudo installer -pkg "$pkg" -target / | tail -1
          codesign --verify --deep --strict /Applications/Mantis.app
          cd desktop/macos/out && shasum -a 256 Mantis-Installer.pkg > mac-app.sha256 && cat mac-app.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: |
            desktop/macos/out/Mantis-Installer.pkg
            desktop/macos/out/mac-app.sha256
          retention-days: 3

  win-app:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/windows/src-tauri -> target

      - name: Сборка приложения Mantis для Windows
        run: |
          npm ci --ignore-scripts
          BUN="$(command -v bun)" bash desktop/windows/build.sh

      - name: Проверка установки и запуска
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "C:\Program Files\Mantis"
          Start-Process desktop/windows/out/Mantis-Setup.exe -ArgumentList "/S" -Wait
          Start-Process "$dir\mantis.exe"
          $a = $null
          for ($i = 0; $i -lt 60 -and !$a; $i++) {
            try { $a = Invoke-RestMethod -TimeoutSec 2 http://127.0.0.1:8797/api/agent } catch { Start-Sleep 1 }
          }
          if (!$a -or $a.shell -ne "windows") { throw "Встроенный Агент не запустился" }
          $a | ConvertTo-Json -Compress
          Get-Process mantis, mantis-agent -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Process "$dir\uninstall.exe" -ArgumentList "/S" -Wait

      - name: Контрольная сумма
        run: cd desktop/windows/out && sha256sum Mantis-Setup.exe > win-app.sha256 && cat win-app.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: win-app
          path: |
            desktop/windows/out/Mantis-Setup.exe
            desktop/windows/out/win-app.sha256
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: [agent, mac-app, win-app]
    # Агент или приложения для Mac и Windows не собрались – сайт всё равно выкладываем (на сервере остаются прежние файлы)
    if: ${{ !cancelled() }}
    env:
      PROD_URL: ${{ vars.PROD_URL || 'https://mantis.rcmit.ru' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mantis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: |
          npm ci --ignore-scripts
          # ffmpeg нужен тестам моста IP-камер (ffmpeg-static ставится скриптом установки, который мы пропускаем)
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -version | head -1

      - name: Тесты (с базой оплат в PostgreSQL)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/mantis_test

      - name: Сборка фронта и сервера API
        run: |
          npm run build
          npm run build:server

      - name: Архивы Mantis Агента
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: agent
          path: agent-out

      - name: Установщик Mantis для Mac
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mac-app
          path: mac-out

      - name: Установщик Mantis для Windows
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: win-app
          path: win-out

      - name: Архив релиза
        run: |
          mkdir -p release out
          cp -r dist release/dist
          cp server/dist/server.cjs server/dist/server.cjs.map server/schema.sql deploy/remote-deploy.sh release/
          # список файлов для скачивания с sha256 (agent.sha256) – по нему сервер забирает их из релиза
          : > release/agent.sha256
          if [ -f agent-out/agent.sha256 ]; then
            cat agent-out/agent.sha256 >> release/agent.sha256
            cp agent-out/Mantis-Agent-*.zip out/
          else
            echo "::warning::Агент не собран – кнопка «Скачать для Windows» будет вести на прежний архив"
          fi
          if [ -f mac-out/mac-app.sha256 ]; then
            cat mac-out/mac-app.sha256 >> release/agent.sha256
            cp mac-out/Mantis-Installer.pkg out/
          else
            echo "::warning::Приложение для Mac не собрано – кнопка «Скачать для macOS» будет вести на прежний установщик"
          fi
          if [ -f win-out/win-app.sha256 ]; then
            # sha256sum на Windows ставит «*» перед именем (двоичный режим) – убираем
            sed 's/ \*/  /' win-out/win-app.sha256 >> release/agent.sha256
            cp win-out/Mantis-Setup.exe out/
          else
            echo "::warning::Приложение для Windows не собрано – кнопка «Скачать для Windows» будет вести на прежний установщик"
          fi
          cat release/agent.sha256
          echo "$GITHUB_SHA" > release/version.txt
          tar -czf out/mantis.tar.gz -C release .
          (cd out && sha256sum mantis.tar.gz > mantis.tar.gz.sha256)
          echo "$GITHUB_SHA" > out/version.txt
          ls -lh out

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="prod-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          FILES=$(ls out/Mantis-Agent-*.zip out/Mantis-Installer.pkg out/Mantis-Setup.exe 2>/dev/null || true)
          gh release create "$TAG" out/mantis.tar.gz out/mantis.tar.gz.sha256 out/version.txt $FILES \
            --target "$GITHUB_SHA" --latest --title "Прод $TAG" \
            --notes "Релиз для mantis.rcmit.ru, коммит $GITHUB_SHA. Сервер подхватит его в течение минуты."

      - name: Ждём, пока сервер выложит релиз
        run: |
          for i in $(seq 1 40); do
            V=$(curl -fsS --max-time 5 "$PROD_URL/api/health" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            echo "попытка $i: на сервере ${V:-нет ответа}"
            [ "$V" = "$GITHUB_SHA" ] && exit 0
            sleep 15
          done
          echo "Сервер не выложил релиз за 10 минут – смотрите journalctl -u mantis-update на сервере"
          exit 1

      - name: Проверка снаружи
        run: |
          curl -fsSI "$PROD_URL/" | tee /tmp/h.txt
          grep -qi '^cross-origin-embedder-policy: require-corp' /tmp/h.txt
          grep -qi '^cross-origin-opener-policy: same-origin' /tmp/h.txt
