[package]
name = "mantis-macos"
version = "0.1.0"
description = "Mantis для macOS – подсчёт посетителей витрины"
authors = ["РСМ АйТи"]
edition = "2021"
publish = false

[[bin]]
name = "mantis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-shell = "2.6"
tauri-plugin-autostart = "2.7"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
