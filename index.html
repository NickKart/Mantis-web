<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFFFFF">
  <title>Mantis</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <script>
    // Адрес без «/» на конце (…/app/mantis) – относительные пути не сработают: поправляем
    if (!location.pathname.endsWith("/") && !/\.[a-z0-9]+$/i.test(location.pathname)) location.replace(location.pathname + "/" + location.search + location.hash);
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/app/main.tsx"></script>
</body>
</html>
